# Production stack. The development pair lives in docker-compose.my.yaml.

services:
  efb:
    image: efb:v3.0.0
    container_name: efb
    depends_on:
      - comwechat
      - telegram_bot_api
    network_mode: "service:comwechat"
    volumes:
      - .:/data
      - "./comwechat/Files/:/comwechat/Files/"
      - "./cleanup.sh:/etc/periodic/daily/cleanup.sh"
      - efb_tmp:/tmp
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    restart: unless-stopped
    environment:
      - EFB_PROFILE=comwechat
    logging:
      driver: json-file
      options:
        max-size: 1m

  comwechat:
    container_name: comwechat
    build:
      context: .
      dockerfile: ComWeChatRobot/Dockerfile
    image: ghcr.io/jiz4oh/comwechatrobot:prod
    volumes:
      - comwechat_wine:/home/user/.wine/
      - "./comwechat/Files/:/home/user/.wine/drive_c/users/user/My Documents/WeChat Files/"
    environment:
        - VNCPASS=jiz4oh
        - COMWECHAT_AUTO_LOGIN=true
        - COMWECHAT_AUTO_LOGIN_TIMEOUT=0
    ports:
      - "5905:5905"
    privileged: true
    restart: unless-stopped

  telegram_bot_api:
    image: ghcr.io/jiz4oh/telegram-bot-api-server:latest
    container_name: telegram_bot_api
    privileged: true
    restart: unless-stopped
    environment:
      - TGSOCKS_PROXY_HOST=127.0.0.1
      - TGSOCKS_PROXY_PORT=7890
    volumes:
      - .:/data
      - "./comwechat/Files/:/comwechat/Files/"
      - efb_tmp:/tmp
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    command:
      - "--local"
      - "--http-port=8081"
      - "--api-id=28892922"
      - "--api-hash=8416b8994bd530b7ae52ca297c9e56e4"
      - "--dir=/var/lib/telegram-bot-api"

volumes:
  comwechat_wine:
  efb_tmp:
  telegram_bot_api_data:
