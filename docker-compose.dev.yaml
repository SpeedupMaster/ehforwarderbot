# Development overlay. Requires a Compose version supporting !reset and !override.
# Use with:
# docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d --build
#
# The bridge client environment below is intentionally development-only. It is
# implemented by the locally mounted python-comwechatrobot-http package.
# Export TELEGRAM_API_ID and TELEGRAM_API_HASH before starting the local Bot API
# service; the debug compose additionally requires COMWECHAT_WINEDBG_VNCPASS.

services:
  efb:
    depends_on:
      - comwechat
      - telegram_bot_api
    network_mode: !reset null
    volumes: !override
      - .:/data
      - "./comwechat/Files/:/comwechat/Files/"
      - "./cleanup.sh:/etc/periodic/daily/cleanup.sh"
      - "./efb-wechat-comwechat-slave/efb_wechat_comwechat_slave:/usr/local/lib/python3.11/site-packages/efb_wechat_comwechat_slave"
      - "./efb-telegram-master/efb_telegram_master:/usr/local/lib/python3.11/site-packages/efb_telegram_master"
      - "./python-comwechatrobot-http/wechatrobot:/usr/local/lib/python3.11/site-packages/wechatrobot"
      - "./log/efb:/var/log"
      - efb_tmp:/tmp
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    environment:
      - PYTHONUNBUFFERED=1
      - EFB_MEDIA_TIMEOUT=10
      - WECHATROBOT_API_BASE=http://comwechat:18888
      - WECHATROBOT_BRIDGE_API_BASE=http://comwechat:19088
      - WECHATROBOT_PULL_WAIT_MS=15000
      - WECHATROBOT_PULL_BATCH_SIZE=50

  comwechat:
    platform: linux/amd64
    build:
      context: ./ComWeChatRobot
    image: comwechatrobot:efb2
    network_mode: !reset null
    environment:
      - COMWECHAT_BRIDGE_ENABLED=true
      - COMWECHAT_BRIDGE_API_HOST=0.0.0.0
      - COMWECHAT_BRIDGE_API_PORT=19088
      - COMWECHAT_API_PORT=18888
      - COMWECHAT_ENABLE_IMAGE_HOOK=true
      - COMWECHAT_ENABLE_VOICE_HOOK=true
      - COMWECHAT_WATCHDOG_API_PORT_FAILURE_THRESHOLD=15
      - COMWECHAT_RUNTIME_ROOT=/runtime-host
      - COMWECHAT_BRIDGE_SNAPSHOT_NAME=comwechat
      - COMWECHAT_BRIDGE_SNAPSHOT_DIR=/runtime-host/.comwechat-snapshots
      - COMWECHAT_BOOT_REORDER_WINDOW_SECONDS=5
      - COMWECHAT_CONSUME_RATE_PER_SEC=50
      - COMWECHAT_BRIDGE_MAX_BUFFER=20000
      - COMWECHAT_HOOK_TRACE=info
      - COMWECHAT_HOOK_SAVE_PATH=C:\Users\user\My Documents\WeChat Files
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
      - GALLIUM_DRIVER=llvmpipe
      - WINEDLLOVERRIDES=vulkan=d
    volumes:
      - "./:/runtime-host/"
    user: "0:0"
    entrypoint: ["/runtime-host/scripts/start-comwechat.sh"]

  telegram_bot_api:
    image: ghcr.io/jiz4oh/telegram-bot-api-server@sha256:9dd13cab07eb719ebbbb29ebb4ee2b86bb15dc7f9ad3690340f59823eb3e52c9
    container_name: telegram_bot_api
    user: "0:0"
    restart: unless-stopped
    volumes:
      - .:/data
      - "./comwechat/Files/:/comwechat/Files/"
      - efb_tmp:/tmp
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    command:
      - "--local"
      - "--http-port=8081"
      - "--api-id=${TELEGRAM_API_ID:?set TELEGRAM_API_ID}"
      - "--api-hash=${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}"
      - "--dir=/var/lib/telegram-bot-api"

  efb2:
    depends_on:
      - comwechat2
      - telegram_bot_api
    network_mode: !reset null
    volumes: !override
      - .:/data
      - "./comwechat/efb2/Files/:/comwechat/Files/"
      - "./cleanup.sh:/etc/periodic/daily/cleanup.sh"
      - "./efb-wechat-comwechat-slave/efb_wechat_comwechat_slave:/usr/local/lib/python3.11/site-packages/efb_wechat_comwechat_slave"
      - "./efb-telegram-master/efb_telegram_master:/usr/local/lib/python3.11/site-packages/efb_telegram_master"
      - "./python-comwechatrobot-http/wechatrobot:/usr/local/lib/python3.11/site-packages/wechatrobot"
      - "./log/efb2:/var/log"
      - efb_tmp:/tmp
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    environment:
      - PYTHONUNBUFFERED=1
      - EFB_MEDIA_TIMEOUT=10
      - WECHATROBOT_API_BASE=http://comwechat2:18888
      - WECHATROBOT_BRIDGE_API_BASE=http://comwechat2:19088
      - WECHATROBOT_PULL_WAIT_MS=15000
      - WECHATROBOT_PULL_BATCH_SIZE=50

  comwechat2:
    platform: linux/amd64
    build:
      context: ./ComWeChatRobot
    image: comwechatrobot:efb2
    network_mode: !reset null
    environment:
      - COMWECHAT_BRIDGE_ENABLED=true
      - COMWECHAT_BRIDGE_SNAPSHOT_NAME=comwechat2
      - COMWECHAT_BRIDGE_SNAPSHOT_DIR=/runtime-host/.comwechat-snapshots
      - COMWECHAT_BRIDGE_API_HOST=0.0.0.0
      - COMWECHAT_BRIDGE_API_PORT=19088
      - COMWECHAT_API_PORT=18888
      - COMWECHAT_ENABLE_IMAGE_HOOK=true
      - COMWECHAT_ENABLE_VOICE_HOOK=true
      - COMWECHAT_WATCHDOG_API_PORT_FAILURE_THRESHOLD=15
      - COMWECHAT_RUNTIME_ROOT=/runtime-host
      - COMWECHAT_BOOT_REORDER_WINDOW_SECONDS=5
      - COMWECHAT_CONSUME_RATE_PER_SEC=50
      - COMWECHAT_BRIDGE_MAX_BUFFER=20000
      - COMWECHAT_HOOK_TRACE=info
      - COMWECHAT_HOOK_SAVE_PATH=C:\Users\user\My Documents\WeChat Files
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
      - GALLIUM_DRIVER=llvmpipe
      - WINEDLLOVERRIDES=vulkan=d
    volumes:
      - "./:/runtime-host/"
    user: "0:0"
    entrypoint: ["/runtime-host/scripts/start-comwechat.sh"]

volumes:
  efb_tmp:
  telegram_bot_api_data:
